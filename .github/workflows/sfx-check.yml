name: Compile and test offline sound FX (temporary)
on:
  push:
    branches: [feature/offline-sfx-20261114]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile source for older Android WebView
        run: |
          npm install --no-audit --no-fund
          npm run web
      - name: Test Go engine, records, voice and offline sound FX
        run: |
          node test_battle_rules.cjs
          node test_auto_scoring.cjs
          node test_two_player.cjs
          node test_sfx.cjs
      - name: Commit transpiled WebView assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js assets/battle.js assets/voice.js assets/sfx.js assets/engine.js assets/catalog.js assets/battle-engine.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: transpile offline sound effects to WebView JS'
            git push origin HEAD:feature/offline-sfx-20261114
          fi

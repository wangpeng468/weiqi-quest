name: Compile two-player frontend (temporary)

on:
  push:
    branches:
      - feature/local-two-player-20261114

permissions:
  contents: write

jobs:
  transpile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build JavaScript for older Android WebView
        run: |
          npm install --no-audit --no-fund
          npm run web
      - name: Run rule and local-player regression tests
        run: |
          node test_battle_rules.cjs
          node test_auto_scoring.cjs
          node test_two_player.cjs
      - name: Commit generated ES5 web assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.js assets/battle.js assets/battle-engine.js assets/engine.js assets/catalog.js assets/voice.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: transpile two-player frontend to ES5'
            git push origin HEAD:feature/local-two-player-20261114
          fi
